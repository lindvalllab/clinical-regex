name: Update docs

on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version-file: 'docs/.nvmrc'
      - name: Build and publish
        working-directory: ./docs
        run: |
          yarn
          yarn gatsby build --prefix-paths
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/lindvalllab/clinical-regex.git
          yarn gh-pages -d public -u 'github-actions-bot <support+actions@github.com>'
        env:
          GITHUB_TOKEN: ${{ secrets.CR_BOT_BASIC_TOKEN }}
