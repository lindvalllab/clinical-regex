name: Update docs

on:
  push:
    branches:
      - 'main'
      - 'publish-docs'
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'

jobs:
  build:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build and publish
        working-directory: ./docs
        run: |
          yarn
          yarn gatsby build --prefix-paths
          yarn gh-pages -d public
