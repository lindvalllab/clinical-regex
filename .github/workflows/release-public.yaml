name: Create public release

on:
  push
  # workflow_run:
  #   workflows: [Build release]
  #   types: [completed]

jobs:
  on-success:
    runs-on: ubuntu-latest
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/github-script@v6
        name: Get latest release
        id: get_latest_release
        with:
          script: |
            await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

      - uses: actions/github-script@v6
        name: Create public release
        env:
          github-token: ${{ secrets.GH_TOKEN_PUBLIC_RELEASES }}
          PUBLIC_REPO_OWNER: akwok-dfci
          PUBLIC_REPO_NAME: clinical-regex-releases
          RELEASE: ${{ steps.get_latest_release.outputs.result }}
        with:
          script: |
            const { PUBLIC_REPO_OWNER, PUBLIC_REPO_NAME, RELEASE } = process.env

            console.log(RELEASE)

